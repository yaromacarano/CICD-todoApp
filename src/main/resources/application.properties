# Application Configuration - Simplified to prevent hanging
spring.application.name=TodoListApp

# Server Configuration
server.port=8080

# Database Configuration (SQLite with absolute path)
spring.datasource.url=jdbc:sqlite:./data/TodoList.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA/Hibernate Configuration (simplified)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Logging Configuration (increased for debugging)
logging.level.com.todoapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Disable unnecessary features that might cause hanging
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
