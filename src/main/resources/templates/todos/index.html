<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List - TodoListApp</title>
    <link rel="stylesheet" href="/lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-sm navbar-toggleable-sm navbar-dark bg-primary border-bottom box-shadow mb-3">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/todos}">
                    <i class="bi bi-check2-square"></i> TodoListApp
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target=".navbar-collapse" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse d-sm-inline-flex justify-content-between">
                    <ul class="navbar-nav flex-grow-1">
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/todos}">
                                <i class="bi bi-list-task"></i> Todo List
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" th:href="@{/todos/create}">
                                <i class="bi bi-plus-circle"></i> New Todo
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <div class="container">
        <main role="main" class="pb-3">
            <div class="container mt-4">
                <div class="row">
                    <div class="col-md-8 offset-md-2">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h2 class="mb-0">Todo List</h2>
                            </div>
                            <div class="card-body">
                                <!-- Error messages inside card body like original -->
                                <div th:if="${errorMessage}" class="alert alert-danger">
                                    <span th:text="${errorMessage}"></span>
                                </div>

                                <a th:href="@{/todos/create}" class="btn btn-success mb-3">
                                    <i class="bi bi-plus-circle"></i> Add New Todo
                                </a>

                                <div th:if="${#lists.isEmpty(todos)}" class="alert alert-info">
                                    No todo items found. Create a new one to get started!
                                </div>

                                <div th:unless="${#lists.isEmpty(todos)}" class="list-group">
                                    <div th:each="item : ${todos}" 
                                         th:class="'list-group-item d-flex justify-content-between align-items-center ' + (${item.completed} ? 'bg-light' : '')">
                                        <div class="d-flex align-items-center">
                                            <form th:action="@{/todos/toggle/{id}(id=${item.id})}" method="post" class="me-3">
                                                <button type="submit" 
                                                        th:class="'btn btn-sm ' + (${item.completed} ? 'btn-success' : 'btn-outline-secondary')">
                                                    <i th:class="'bi ' + (${item.completed} ? 'bi-check-circle-fill' : 'bi-circle')"></i>
                                                </button>
                                            </form>
                                            <span th:class="${item.completed} ? 'text-decoration-line-through text-muted' : ''" 
                                                  th:text="${item.description}">
                                            </span>
                                        </div>
                                        <div>
                                            <a th:href="@{/todos/edit/{id}(id=${item.id})}" class="btn btn-sm btn-outline-primary me-1">
                                                <i class="bi bi-pencil"></i> Edit
                                            </a>
                                            <form th:action="@{/todos/delete/{id}(id=${item.id})}" method="post" class="d-inline">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" 
                                                        onclick="return confirm('Are you sure you want to delete this item?');">
                                                    <i class="bi bi-trash"></i> Delete
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer text-muted">
                                <small>
                                    Total: <span th:text="${#lists.size(todos)}"></span> | 
                                    Completed: <span th:text="${completedCount}"></span> | 
                                    Pending: <span th:text="${pendingCount}"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer class="footer text-muted">
        <div class="container">
            &copy; 2025 - TodoListApp - Created on <span th:text="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"></span>
        </div>
    </footer>
    <script src="/lib/jquery/dist/jquery.min.js"></script>
    <script src="/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/site.js"></script>
</body>
</html>
