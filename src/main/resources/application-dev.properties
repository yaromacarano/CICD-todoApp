# Development Profile Configuration
# Equivalent to appsettings.Development.json in the original ASP.NET Core application

# Enable detailed logging for development
logging.level.com.todoapp=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Enable Thymeleaf template caching disabled for development
spring.thymeleaf.cache=false

# Enable DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# JPA Configuration for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security - Disable CSRF for development (can be enabled for production)
spring.security.csrf.enabled=false
