name: Todo CI/CD WF

on:
  push:
    branches:
      - github-actions

  pull_request:
    branches:
      - github-actions

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-scan-deploy:
    name: Build, Test, Scan and Deploy
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests
        run: mvn clean verify

      - name: Checkstyle Analysis
        run: mvn checkstyle:checkstyle

      - name: Build application
        run: mvn package -DskipTests

      - name: Sonar Code Analysis
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=todo-sonar
            -Dsonar.projectName=todo-sonar
            -Dsonar.projectVersion=1.0
            -Dsonar.sources=src/
            -Dsonar.java.binaries=target/classes/
            -Dsonar.junit.reportPath=target/surefire-reports/
            -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: todolist-app-1.0.0
          path: target/*.jar

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.run_number }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Render ECS task definition
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: aws/task-definition-template.json
          container-name: ${{ vars.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        if: github.ref == 'refs/heads/github-actions' && github.event_name != 'pull_request'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.SERVICE }}
          cluster: ${{ vars.CLUSTER }}
          wait-for-service-stability: true
