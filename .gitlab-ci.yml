stages:
  - test
  - build
  - sonarqube-check
  - push
  - deploy

default:
  tags:
    - aws
    - docker
    - ec2
    
variables:
  IMAGE_TAG: $CI_PIPELINE_IID
  IMAGE_URI: $ECR_REGISTRY/$ECR_REPOSITORY:$CI_PIPELINE_IID

test-job:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - mvn test
    - mvn checkstyle:checkstyle

build-job:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/classes/
      - target/surefire-reports/
      - target/checkstyle-result.xml
      - target/todolist-app-1.0.0.jar
    when: always

sonarqube-check-job:
  stage: sonarqube-check
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never
  script:
    - |
      sonar-scanner \
        -Dsonar.projectKey=todo-sonar \
        -Dsonar.projectName=todo-sonar \
        -Dsonar.projectVersion=1.0 \
        -Dsonar.sources=src/ \
        -Dsonar.java.binaries=target/classes/ \
        -Dsonar.junit.reportPaths=target/surefire-reports/ \
        -Dsonar.java.checkstyle.reportPaths=target/checkstyle-result.xml \
        -Dsonar.host.url=$SONAR_HOST_URL \
        -Dsonar.token=$SONAR_TOKEN \
        -Dsonar.qualitygate.wait=true

push-image-job:
  stage: push
  image: alpine:3.20
  services:
    - docker:27.1.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  before_script:
    - apk add --no-cache docker-cli aws-cli
    - docker version
    - aws --version
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build -t $IMAGE_URI .
    - docker push $IMAGE_URI

deploy-ecs-job:
  stage: deploy
  image: 
    name: amazon/aws-cli:2.17.44
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never
  before_script:
    - chmod +x scripts/deploy-ecs.sh
  script:
    - ./scripts/deploy-ecs.sh
